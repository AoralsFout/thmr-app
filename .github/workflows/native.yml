name: Native host

on:
  push:
    branches: [main, codex/unified-cli-tui-gui]
    paths: ['crates/**', 'Cargo.*', 'native/**', 'test/fixtures/**', 'rust-toolchain.toml', 'protocol/**', 'pubspec.yaml', 'tool/test_unified_host.py', 'tool/test_shared_audio_host.py', '.github/workflows/native.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'native/**', 'test/fixtures/**', 'rust-toolchain.toml', 'protocol/**', 'pubspec.yaml', 'tool/test_unified_host.py', 'tool/test_shared_audio_host.py', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Format, lint and test
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: Isolated Linux playback and native host smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 dbus-x11
          dbus-run-session -- python3 tool/test_unified_host.py
      - name: macOS background application lifecycle smoke
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          python3 tool/test_unified_host.py
      - name: Verify executable version without audio dependencies
        shell: bash
        run: |
          ./target/debug/thmr --version
          ./target/debug/thmrd --version
